<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Agence Secrète — Mission</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud" class="hidden">
      <div class="hud-item">
        <span class="hud-label">ÉTAPE</span>
        <span id="hud-step">0/0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">TEMPS</span>
        <span id="hud-timer">00:00</span>
      </div>
      <button id="hud-reset" title="Recommencer depuis le début" aria-label="Recommencer">↺</button>
    </header>

    <main id="screen"></main>
  </div>

  <!-- Le contenu de l'histoire est chargé avant le moteur -->
  <script src="stories/mission-espions.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
